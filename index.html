<!DOCTYPE html>
<html>
  <head>
    <title>File Input Example</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .pagination {
        margin-top: 10px;
      }
      .pagination button {
        padding: 5px 10px;
        margin: 0 2px;
      }
      #valorTotal {
        margin-top: 10px;
      }
      #productTable {
        margin-top: 10px;
      }
      #invalidLines {
        margin-top: 10px;
        color: red;
      }
      #invalidLines button {
        margin-top: 10px;
      }
      #lojaKeySelect {
        margin-left: 10px;
      }
      #filterLojaKey,
      #filterGTIN,
      #filterProduto,
      #filterSemana,
      #filterQntVendida,
      #filterValorVendido,
      #filterDataInicial,
      #filterDataFinal {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 5px;
      }

      .loja,
      .dataInicial,
      .dataFinal {
        width: 50px;
        align-items: center;
      }

      #pageInfo {
        margin: 0 10px;
      }

      #prevPage,
      #nextPage {
        padding: 5px 10px;
        margin: 0 2px;
      }

      #prevPage:disabled,
      #nextPage:disabled {
        background-color: #f2f2f2;
        color: #666;
      }
    </style>
  </head>
  <body>
    <input type="file" accept=".txt" id="fileInput" />
    <label for="lojaKeySelect">Selecione a loja:</label>
    <select id="lojaKeySelect">
      <option value="todas">Todas</option>
    </select>

    <table id="productTable">
      <thead>
        <tr>
          <th class="loja"><input type="text" id="filterLojaKey" /><br />Loja</th>
          <th class="gtin"><input type="text" id="filterGTIN" /><br />GTIN</th>
          <th class="produto"><input type="text" id="filterProduto" /><br />Produto</th>
          <th class="semana"><input type="text" id="filterSemana" /><br />Semana</th>
          <th class="qntVendida"><input type="text" id="filterQntVendida" /><br />Quantidade Vendida</th>
          <th class="valorVendido"><input type="text" id="filterValorVendido" /><br />Valor Vendido</th>
          <th class="dataInicial"><input type="text" id="filterDataInicial" /><br />Inicial</th>
          <th class="dataFinal"><input type="text" id="filterDataFinal" /><br />Final</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>
    <div id="valorTotal"></div>

    <div class="pagination">
      <button id="prevPage">Anterior</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Próxima</button>
    </div>
    <div id="invalidLines"></div>
    <script>
      document.getElementById("fileInput").addEventListener("change", function (e) {
        var file = e.target.files[0];
        var reader = new FileReader();
        var lojas = {}; // Object to store the data for each lojaKey
        var totalValorVendido = 0; // Variable to store the sum of valorVendido
        var lineCount = 0;
        var products = []; // Array to store all products
        var currentPage = 1;
        var itemsPerPage = 10;
        var invalidLines = []; // Array to store invalid lines

        reader.onload = function (e) {
          var contents = e.target.result;
          var lines = contents.split("\n");

          lines.forEach(function (line) {
            var lojaKey = line.substring(0, 10).trim().replace(/^0+/, "");
            var gtin = line.substring(10, 24).trim();
            var produto = line.substring(24, 94).trim();
            var semana = line.substring(94, 100).trim();
            var qntVendida = line.substring(100, 109).trim();
            var valorVendido = line.substring(109, 120).trim();
            var dataInicial = line.substring(121, 123).trim();
            var dataFinal = line.substring(123, 125).trim();
            lineCount++;
            // Convert valorVendido to a number with two decimal places
            valorVendido = parseFloat(valorVendido / 100).toFixed(2);
            qntVendida = parseFloat(qntVendida / 1000).toFixed(3);

            var jsonObject = {
              lojaKey: lojaKey,
              gtin: gtin,
              produto: produto,
              semana: semana,
              qntVendida: qntVendida,
              valorVendido: valorVendido,
              dataInicial: dataInicial,
              dataFinal: dataFinal,
            };

            // Check if jsonObject has a value and if valorVendido is greater than 0
            if (line.trim() !== "") {
              if (Object.values(jsonObject).every((value) => value !== "") && parseFloat(valorVendido) > 0) {
                if (!lojas[lojaKey]) {
                  lojas[lojaKey] = [];
                }
                lojas[lojaKey].push(jsonObject);
                products.push(jsonObject);
                totalValorVendido += parseFloat(valorVendido);
              } else {
                if (parseFloat(valorVendido) === 0) {
                  invalidLines.push({
                    line: line,
                    reason: "O valor vendido não é maior que 0",
                  });
                } else {
                  invalidLines.push({
                    line: line,
                    reason: "Campo inválido",
                  });
                }
              }
            }
          });

          // Populate the select with lojaKey options
          var lojaKeySelect = document.getElementById("lojaKeySelect");
          Object.keys(lojas).forEach(function (lojaKey) {
            var option = document.createElement("option");
            option.value = lojaKey;
            option.text = lojaKey;
            lojaKeySelect.appendChild(option);
          });

          // Update the valorTotalElement with the totalValorVendido
          var valorTotalElement = document.getElementById("valorTotal");
          valorTotalElement.textContent =
            "Valor Total: " + totalValorVendido.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

          // Display invalid lines
          var invalidLinesElement = document.getElementById("invalidLines");
          var invalidLinesButton = document.createElement("button");
          invalidLinesButton.textContent = "Veja as linhas inválidas";
          invalidLinesButton.addEventListener("click", function () {
            invalidLinesElement.textContent = "Linhas Inválidas: \n";
            invalidLines.forEach(function (invalidLine) {
              var lineElement = document.createElement("div");
              lineElement.textContent = invalidLine.line + " Motivo: " + invalidLine.reason;
              invalidLinesElement.appendChild(lineElement);
            });
          });
          invalidLinesElement.appendChild(invalidLinesButton);

          // Add event listener to the select
          lojaKeySelect.addEventListener("change", function () {
            var selectedLojaKey = lojaKeySelect.value;
            currentPage = 1;
            if (selectedLojaKey === "todas") {
              renderTable(products);
              valorTotalElement.textContent =
                "Valor Total: " + totalValorVendido.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
            } else {
              var filteredProducts = lojas[selectedLojaKey] || [];
              renderTable(filteredProducts);
              var valorTotalLoja = filteredProducts.reduce((sum, product) => sum + parseFloat(product.valorVendido), 0);
              valorTotalElement.textContent =
                "Valor Total da Loja " +
                selectedLojaKey +
                ": " +
                valorTotalLoja.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
            }
          });

          // Add event listener to the filter inputs
          var filterLojaKey = document.getElementById("filterLojaKey");
          filterLojaKey.addEventListener("input", function () {
            var filterValue = filterLojaKey.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.lojaKey.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterGTIN = document.getElementById("filterGTIN");
          filterGTIN.addEventListener("input", function () {
            var filterValue = filterGTIN.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.gtin.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterProduto = document.getElementById("filterProduto");
          filterProduto.addEventListener("input", function () {
            var filterValue = filterProduto.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.produto.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterSemana = document.getElementById("filterSemana");
          filterSemana.addEventListener("input", function () {
            var filterValue = filterSemana.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.semana.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterQntVendida = document.getElementById("filterQntVendida");
          filterQntVendida.addEventListener("input", function () {
            var filterValue = filterQntVendida.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.qntVendida.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterValorVendido = document.getElementById("filterValorVendido");
          filterValorVendido.addEventListener("input", function () {
            var filterValue = filterValorVendido.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.valorVendido.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterDataInicial = document.getElementById("filterDataInicial");
          filterDataInicial.addEventListener("input", function () {
            var filterValue = filterDataInicial.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.dataInicial.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          var filterDataFinal = document.getElementById("filterDataFinal");
          filterDataFinal.addEventListener("input", function () {
            var filterValue = filterDataFinal.value.toLowerCase();
            var filteredProducts = products.filter(function (product) {
              return product.dataFinal.toLowerCase().includes(filterValue);
            });
            renderTable(filteredProducts);
            updatePagination(filteredProducts.length);
          });

          renderTable(products);
          updatePagination(products.length);

          console.log(lineCount); // Display the number of lines
          console.log(lojas); // Display the object containing data for each lojaKey
          console.log("Total Valor Vendido:", totalValorVendido.toFixed(2)); // Display the sum of valorVendido
        };

        reader.readAsText(file);

        function renderTable(data) {
          var tableBody = document.getElementById("productTable").getElementsByTagName("tbody")[0];
          tableBody.innerHTML = "";
          var start = (currentPage - 1) * itemsPerPage;
          var end = start + itemsPerPage;
          var paginatedItems = data.slice(start, end);

          paginatedItems.forEach(function (item) {
            var row = tableBody.insertRow();
            Object.values(item).forEach(function (value) {
              var cell = row.insertCell();
              cell.textContent = value;
            });
          });

          updatePagination(data.length);
        }

        function updatePagination(totalItems) {
          var totalPages = Math.ceil(totalItems / itemsPerPage);
          document.getElementById("pageInfo").textContent = "Página " + currentPage + " de " + totalPages;
          document.getElementById("prevPage").disabled = currentPage === 1;
          document.getElementById("nextPage").disabled = currentPage === totalPages;
        }

        document.getElementById("prevPage").addEventListener("click", function () {
          if (currentPage > 1) {
            currentPage--;
            var selectedLojaKey = document.getElementById("lojaKeySelect").value;
            var data = selectedLojaKey === "todas" ? products : lojas[selectedLojaKey] || [];
            renderTable(data);
          }
        });

        document.getElementById("nextPage").addEventListener("click", function () {
          var selectedLojaKey = document.getElementById("lojaKeySelect").value;
          var data = selectedLojaKey === "todas" ? products : lojas[selectedLojaKey] || [];
          if (currentPage * itemsPerPage < data.length) {
            currentPage++;
            renderTable(data);
          }
        });
      });
    </script>
  </body>
</html>
